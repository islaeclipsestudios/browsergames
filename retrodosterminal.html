<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RetroDOS Boot Terminal</title>
<style>
:root{--phosphor:#a9fca9;--bright:#f4fff4;--dim:#5cbb5c;--bg:#020702;--amber:#ffe283;--red:#ff8080}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#111}body{display:grid;place-items:center;padding:18px;font-family:Consolas,"Courier New",monospace;color:var(--phosphor)}
#machine{width:min(1120px,100%);height:min(780px,calc(100vh - 36px));padding:13px;background:linear-gradient(145deg,#393939,#1c1c1c);border:13px solid #292929;border-radius:15px;box-shadow:0 28px 85px #000}
#screen{position:relative;height:100%;overflow:auto;background:var(--bg);border:3px solid #174c1a;padding:18px;white-space:pre-wrap;word-break:break-word;line-height:1.3;font-size:16px;text-shadow:0 0 7px rgba(169,252,169,.46);box-shadow:inset 0 0 42px #000;scrollbar-color:#357a35 #071107}
#screen:after{content:"";position:absolute;z-index:5;pointer-events:none;inset:0;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.14) 0,rgba(0,0,0,.14) 1px,transparent 2px,transparent 4px);mix-blend-mode:multiply}
#output{min-height:calc(100% - 28px)}#promptline{display:flex;min-height:23px;align-items:baseline}#prompt{flex:none}#command{flex:1;min-width:1ch;outline:0;caret-color:var(--bright);color:var(--bright)}.amber{color:var(--amber)}.error{color:var(--red)}.dim{color:var(--dim)}.hide{display:none!important}
#reboot{position:sticky;float:right;top:0;z-index:10;margin:0 0 12px 12px;padding:0;border:0;background:transparent;color:var(--dim);font:inherit;font-size:13px;text-shadow:inherit;cursor:pointer}#reboot:hover,#reboot:focus{color:var(--amber);outline:0;text-decoration:underline}#reboot[disabled]{color:#286128;cursor:wait;text-decoration:none}
.editor-box{position:relative;z-index:10;margin:8px 0;border:1px solid var(--phosphor);padding:8px;background:#071007}.editor-title{color:var(--amber)}.editor-area{position:relative;z-index:11;display:block;width:100%;height:260px;margin-top:8px;background:#020702;color:var(--phosphor);border:1px solid #397c39;font:16px/1.3 Consolas,"Courier New",monospace;padding:8px;resize:vertical;outline:0;caret-color:var(--bright);pointer-events:auto;white-space:pre;tab-size:4}.editor-area:focus{border-color:var(--amber);box-shadow:0 0 10px rgba(255,226,131,.28)}
@media(max-width:600px){body{padding:0}#machine{height:100vh;border-radius:0;border-width:7px;padding:7px}#screen{padding:12px;font-size:14px}.editor-area{font-size:14px}}
</style>
</head>
<body>
<div id="machine"><main id="screen" role="application" aria-label="RetroDOS computer terminal" tabindex="0"><button id="reboot" type="button" title="Restart the virtual computer">[ REBOOT ]</button><div id="output"></div><div id="promptline" class="hide"><span id="prompt"></span><span id="command" contenteditable="true" spellcheck="false" aria-label="DOS command input"></span></div></main></div>
<script>
(()=>{'use strict';
const DISK_KEY='retrodos-terminal-disk-v2',out=document.getElementById('output'),screen=document.getElementById('screen'),line=document.getElementById('promptline'),promptEl=document.getElementById('prompt'),cmdEl=document.getElementById('command'),rebootButton=document.getElementById('reboot');
let state,currentPath=['C:'],history=[],historyIndex=0,booting=false,ready=false,editorOpen=false;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function defaultDisk(){return{version:2,files:{'C:':{type:'dir',children:{DOS:{type:'dir',children:{}},GAMES:{type:'dir',children:{'README.TXT':{type:'file',content:'Welcome to RetroDOS Games.\n\nTry: CD \\GAMES\n'}}},DOCS:{type:'dir',children:{'WELCOME.TXT':{type:'file',content:'Welcome to RetroDOS Terminal.\n\nYour virtual C: disk is stored in this browser.\nType HELP for a command list.\n'}}},'AUTOEXEC.BAT':{type:'file',content:'@ECHO OFF\nCLS\nECHO RetroDOS Terminal 1.0\nECHO Type HELP for a list of commands.\n'},'CONFIG.SYS':{type:'file',content:'FILES=20\nBUFFERS=10\n'},'COMMAND.COM':{type:'file',content:'RetroDOS Command Processor'}}}}};}
function load(){try{let d=JSON.parse(localStorage.getItem(DISK_KEY));return d&&d.files&&d.files['C:']?d:defaultDisk()}catch{return defaultDisk()}}function save(){localStorage.setItem(DISK_KEY,JSON.stringify(state))}function now(){let d=new Date();return{date:d.toLocaleDateString('en-US'),time:d.toLocaleTimeString('en-US',{hour12:false})}}function pathString(p=currentPath){return p.join('\\')+'\\'}function scroll(){screen.scrollTop=screen.scrollHeight}function text(s='',cl=''){let d=document.createElement('div');d.textContent=s;if(cl)d.className=cl;out.appendChild(d);scroll()}function prompt(){return pathString()+'>'}function upd(){promptEl.textContent=prompt()}function focus(){if(ready&&!editorOpen){cmdEl.focus();let r=document.createRange(),s=window.getSelection();r.selectNodeContents(cmdEl);r.collapse(false);s.removeAllRanges();s.addRange(r)}scroll()}
function norm(n){return n.trim().replaceAll('/','\\').toUpperCase()}function resolve(raw='',base=currentPath){raw=raw.trim().replaceAll('/','\\');if(!raw)return[...base];let parts;if(/^[A-Za-z]:/.test(raw)){let drive=raw.slice(0,2).toUpperCase();if(drive!=='C:')return null;parts=['C:'];raw=raw.slice(2);if(!raw.startsWith('\\'))parts=[...base]}else if(raw.startsWith('\\'))parts=['C:'];else parts=[...base];for(let x of raw.split('\\')){x=norm(x);if(!x||x==='.')continue;if(x==='..'){if(parts.length>1)parts.pop();continue}parts.push(x)}return parts}function nodeAt(p){if(!p||p[0]!=='C:')return null;let n=state.files['C:'];for(let i=1;i<p.length;i++){if(!n||n.type!=='dir')return null;n=n.children[p[i]]}return n||null}function parentName(raw){let p=resolve(raw);if(!p||p.length<2)return null;let name=p.pop();return{parent:nodeAt(p),name,path:p}}function parse(s){let a=[],c='',q=false;for(let ch of s.trim()){if(ch==='"')q=!q;else if(/\s/.test(ch)&&!q){if(c){a.push(c);c=''}}else c+=ch}if(c)a.push(c);return a}function file(raw){let n=nodeAt(resolve(raw));return n&&n.type==='file'?n:null}function wild(s){return new RegExp('^'+s.replace(/[.+^${}()|[\]\\]/g,'\\$&').replaceAll('*','.*').replaceAll('?','.')+'$','i')}
function help(){text('RetroDOS Terminal commands:','amber');text('  DIR [path] [/W]        List directory contents');text('  CD [path] | CD..       Change directory');text('  MD name | RD name      Create or remove directory');text('  TYPE file               Display a text file');text('  COPY source dest        Copy a file');text('  DEL file                Delete files; * and ? are supported');text('  REN old new             Rename a file or directory');text('  EDIT file               Open the built-in text editor');text('  ECHO text > file        Write text; >> appends');text('  CLS, DATE, TIME, VER, VOL, TREE, HELP');text('  REBOOT                  Restart with POST and DOS boot sequence');text('  FORMAT /RESET           Reset virtual C: disk');text('  EXPORT / IMPORT         Back up or restore the disk');}
function dir(a){let wide=a.some(x=>x.toUpperCase()==='/W'),target=a.find(x=>x.toUpperCase()!=='/W')||'',p=resolve(target),n=nodeAt(p);if(!n||n.type!=='dir')return text('File not found.','error');text(' Volume in drive C is RETRODOS');text(' Directory of '+pathString(p));text('');let e=Object.entries(n.children).sort((a,b)=>a[0].localeCompare(b[0]));if(wide){let z='';for(let [k,v] of e){z+=(v.type==='dir'?'['+k+']':k).padEnd(18);if(z.length>70){text(z);z=''}}if(z)text(z)}else for(let[k,v]of e){let t=now();text((v.type==='dir'?' <DIR>       ':'       '+String(v.content.length).padStart(8)+' ')+t.date.padEnd(12)+t.time+'  '+k)}text('');text('  '+e.filter(([,v])=>v.type==='file').length+' File(s)');text('  '+e.filter(([,v])=>v.type==='dir').length+' Dir(s)     Virtual browser disk')}
function cd(a){if(!a.length)return text(pathString());let p=resolve(a.join(' ')),n=nodeAt(p);if(!n||n.type!=='dir')return text('The system cannot find the path specified.','error');currentPath=p;upd()}function md(a){if(!a.length)return text('Required parameter missing.','error');let r=parentName(a.join(' '));if(!r||!r.parent||r.parent.type!=='dir')return text('The system cannot find the path specified.','error');if(r.parent.children[r.name])return text('A subdirectory or file already exists.','error');r.parent.children[r.name]={type:'dir',children:{}};save()}function rd(a){let r=parentName(a.join(' ')),n=r&&r.parent&&r.parent.children[r.name];if(!n||n.type!=='dir')return text('The system cannot find the path specified.','error');if(Object.keys(n.children).length)return text('The directory is not empty.','error');delete r.parent.children[r.name];save()}function type(a){let f=file(a.join(' '));if(!f)return text('File not found.','error');text(f.content)}function copy(a){if(a.length<2)return text('The syntax of the command is incorrect.','error');let f=file(a[0]),r=parentName(a.slice(1).join(' '));if(!f)return text('File not found - '+a[0],'error');if(!r||!r.parent||r.parent.type!=='dir')return text('The system cannot find the path specified.','error');r.parent.children[r.name]={type:'file',content:f.content};save();text('        1 file(s) copied.')}function del(a){let p=resolve(a.join(' '));if(!p||p.length<2)return text('File not found.','error');let pat=p.pop(),pa=nodeAt(p),re=wild(pat),ns=pa&&pa.type==='dir'?Object.keys(pa.children).filter(k=>pa.children[k].type==='file'&&re.test(k)):[];if(!ns.length)return text('File not found.','error');ns.forEach(k=>delete pa.children[k]);save();text(ns.length+' file(s) deleted.')}function ren(a){if(a.length<2)return text('The syntax of the command is incorrect.','error');let r=parentName(a[0]),n=norm(a[1]);if(!r||!r.parent||!r.parent.children[r.name])return text('File not found.','error');if(!n||n.includes('\\')||r.parent.children[n])return text('Duplicate file name or invalid name.','error');r.parent.children[n]=r.parent.children[r.name];delete r.parent.children[r.name];save()}
function edit(name){if(editorOpen)return;let r=parentName(name);if(!r||!r.parent||r.parent.type!=='dir')return text('The system cannot find the path specified.','error');let existing=r.parent.children[r.name],old=existing&&existing.type==='file'?existing.content:'';let box=document.createElement('section'),title=document.createElement('div'),area=document.createElement('textarea');editorOpen=true;line.classList.add('hide');box.className='editor-box';title.className='editor-title';title.textContent='EDIT '+r.name+'  — Ctrl+S: save   Esc: cancel';area.className='editor-area';area.value=old;area.spellcheck=false;area.wrap='off';area.setAttribute('aria-label','Editing '+r.name);box.append(title,area);out.appendChild(box);scroll();requestAnimationFrame(()=>{area.focus();area.setSelectionRange(area.value.length,area.value.length)});function close(message){box.remove();editorOpen=false;line.classList.remove('hide');if(message)text(message);focus()}area.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key.toLowerCase()==='s'){e.preventDefault();r.parent.children[r.name]={type:'file',content:area.value};save();close('File saved: '+r.name);return}if(e.key==='Escape'){e.preventDefault();close('Edit cancelled.');return}if(e.key==='Tab'){e.preventDefault();let start=area.selectionStart,end=area.selectionEnd;area.setRangeText('    ',start,end,'end')}})}
function echo(raw){let m=raw.match(/^\s*(.*?)\s*(>{1,2})\s*(.+?)\s*$/);if(!m)return text(raw.trim()||'ECHO is on.');let r=parentName(m[3]),old=r&&r.parent.children[r.name];if(!r||!r.parent||r.parent.type!=='dir')return text('The system cannot find the path specified.','error');if(old&&old.type!=='file')return text('Access denied.','error');r.parent.children[r.name]={type:'file',content:m[2]==='>>'&&old?old.content+(old.content?'\n':'')+m[1]:m[1]};save()}
function tree(p=currentPath,prefix=''){let n=nodeAt(p);if(!n)return;text(prefix+pathString(p));let e=Object.entries(n.children).filter(([,v])=>v.type==='dir').sort();e.forEach(([k],i)=>{let last=i===e.length-1;text(prefix+(last?'\\---':'|---')+k);tree([...p,k],prefix+(last?'    ':'|   '))})}function exp(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='retrodos-disk-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);text('Disk backup download started.')}function imp(){let i=document.createElement('input');i.type='file';i.accept='application/json';i.onchange=()=>{let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.files||!d.files['C:'])throw 0;state=d;currentPath=['C:'];save();upd();text('Disk backup restored.')}catch{text('Invalid RetroDOS disk backup.','error')}};r.readAsText(f)};i.click()}
function run(lineText){let raw=lineText.trim();if(!raw)return;text(prompt()+raw);history.push(raw);if(history.length>100)history.shift();historyIndex=history.length;let[c,...a]=parse(raw),u=(c||'').toUpperCase();if(u==='ECHO')return echo(raw.slice(c.length));switch(u){case'HELP':case'?':help();break;case'DIR':dir(a);break;case'CD':case'CHDIR':cd(a);break;case'MD':case'MKDIR':md(a);break;case'RD':case'RMDIR':rd(a);break;case'TYPE':type(a);break;case'COPY':copy(a);break;case'DEL':case'ERASE':del(a);break;case'REN':case'RENAME':ren(a);break;case'EDIT':a.length?edit(a.join(' ')):text('Required parameter missing.','error');break;case'CLS':out.innerHTML='';break;case'VER':text('RetroDOS Terminal version 1.0 (Browser Edition)');break;case'DATE':text('Current date is '+now().date);break;case'TIME':text('Current time is '+now().time);break;case'VOL':text('Volume in drive C is RETRODOS\nVolume Serial Number is 1987-2026');break;case'TREE':tree(resolve(a[0]||''));break;case'REBOOT':boot();break;case'EXPORT':exp();break;case'IMPORT':imp();break;case'FORMAT':if(a[0]?.toUpperCase()==='/RESET'){if(confirm('Erase the RetroDOS virtual C: drive?')){state=defaultDisk();currentPath=['C:'];save();out.innerHTML='';text('Formatting complete. Fresh virtual disk created.')}}else text('Type FORMAT /RESET to erase the virtual disk.','amber');break;case'RUN':let f=file(a.join(' '));text(f?'Launching '+a.join(' ')+'...\nNative DOS programs cannot execute inside this browser simulation.':'Bad command or file name.','amber');break;default:text('Bad command or file name: '+c,'error')}}
async function boot(){if(booting||editorOpen)return;booting=true;ready=false;line.classList.add('hide');rebootButton.disabled=true;rebootButton.textContent='[ REBOOTING... ]';out.innerHTML='';currentPath=['C:'];let say=async(s,ms=280,cl='')=>{text(s,cl);await wait(ms)};await say('');await say('RetroDOS BIOS Version 1.00');await say('Copyright (C) 1987-2026 RetroDOS Systems');await say('');await say('CPU: 80486DX Compatible');await say('Memory Test: 640K OK',500);await say('');await say('Fixed Disk 0: RETRODOS Virtual Disk',420);await say('Booting from C: ...',650);await say('');await say('Starting MS-DOS...',420);await say('');await say('HIMEM is testing extended memory...done.',240);await say('C:\\>CALL AUTOEXEC.BAT',260);let auto=file('C:\\AUTOEXEC.BAT');if(auto){for(let s of auto.content.split(/\r?\n/)){let z=s.trim();if(!z||z.startsWith('@')&&z.slice(1).trim().toUpperCase()==='ECHO OFF')continue;if(z.toUpperCase()==='CLS'){out.innerHTML='';continue}if(z.toUpperCase().startsWith('ECHO '))text(z.slice(5));else text(z)}}await wait(200);ready=true;booting=false;rebootButton.disabled=false;rebootButton.textContent='[ REBOOT ]';line.classList.remove('hide');upd();focus()}
cmdEl.addEventListener('keydown',e=>{if(!ready||editorOpen)return;if(e.key==='Enter'){e.preventDefault();let v=cmdEl.textContent;cmdEl.textContent='';run(v);upd();focus()}else if(e.key==='ArrowUp'){e.preventDefault();if(historyIndex>0)historyIndex--;cmdEl.textContent=history[historyIndex]||'';focus()}else if(e.key==='ArrowDown'){e.preventDefault();if(historyIndex<history.length-1){historyIndex++;cmdEl.textContent=history[historyIndex]||''}else{historyIndex=history.length;cmdEl.textContent=''}focus()}else if(e.key==='F1'){e.preventDefault();text(prompt()+'HELP');help()}else if(e.key==='Tab'){e.preventDefault();let x=cmdEl.textContent.trim();if(x&&!x.includes(' ')){let z=['HELP','DIR','CD','MD','RD','TYPE','COPY','DEL','REN','EDIT','ECHO','CLS','DATE','TIME','VER','VOL','TREE','REBOOT','EXPORT','IMPORT','FORMAT'].filter(v=>v.startsWith(x.toUpperCase()));if(z.length===1){cmdEl.textContent=z[0]+' ';focus()}}}});screen.addEventListener('mousedown',e=>{if(e.target!==rebootButton&&!editorOpen)setTimeout(focus,0)});rebootButton.onclick=boot;state=load();boot();
})();
</script>
</body>
</html>
